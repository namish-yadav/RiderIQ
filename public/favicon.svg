<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Subtle inner glow accent -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="none" stroke="#06b6d4" stroke-width="0.4" opacity="0.25"/>

  <!-- "R" letter -->
  <!-- Vertical stroke of R -->
  <rect x="10" y="13" width="5.5" height="38" rx="2" fill="url(#textGrad)" filter="url(#glow)"/>
  <!-- Top horizontal bar of R -->
  <rect x="10" y="13" width="19" height="5.5" rx="2" fill="url(#textGrad)"/>
  <!-- Middle horizontal bar of R -->
  <rect x="10" y="30.5" width="18" height="5" rx="2" fill="url(#textGrad)"/>
  <!-- Right vertical of R bump -->
  <rect x="24.5" y="13" width="5" height="23" rx="2" fill="url(#textGrad)"/>
  <!-- Leg of R (diagonal) -->
  <rect x="21" y="35" width="5.5" height="16" rx="2" fill="url(#textGrad)" transform="rotate(18 21 35)"/>

  <!-- "I" letter -->
  <!-- Top bar of I -->
  <rect x="36" y="13" width="18" height="5.5" rx="2" fill="url(#textGrad)" filter="url(#glow)"/>
  <!-- Vertical stroke of I -->
  <rect x="42" y="13" width="5.5" height="38" rx="2" fill="url(#textGrad)"/>
  <!-- Bottom bar of I -->
  <rect x="36" y="45.5" width="18" height="5.5" rx="2" fill="url(#textGrad)"/>

  <!-- Accent dot / cyan spark in top right -->
  <circle cx="57" cy="7" r="2.5" fill="#22d3ee" opacity="0.7"/>
</svg>